<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manga Pipeline GUI</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1f2430;
        --text: #e8ecf1;
        --muted: #98a2b3;
        --accent: #4f8cff;
        --border: #2b3240;
        --danger: #d9534f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app {
        display: grid;
        grid-template-columns: 360px 1fr;
        min-height: 100vh;
      }
      .sidebar, .main {
        padding: 20px;
      }
      .sidebar {
        border-right: 1px solid var(--border);
        background: var(--panel);
      }
      .main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 16px;
      }
      h1, h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      .section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }
      label {
        display: block;
        margin-bottom: 12px;
        font-size: 13px;
        color: var(--muted);
      }
      input, textarea, select, button {
        width: 100%;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        padding: 10px 12px;
        font: inherit;
      }
      textarea { min-height: 120px; resize: vertical; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .buttons { display: flex; gap: 10px; }
      .buttons button { width: auto; min-width: 120px; }
      button.primary { background: var(--accent); border-color: var(--accent); }
      button.danger { background: var(--danger); border-color: var(--danger); }
      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }
      .dot {
        width: 10px; height: 10px; border-radius: 999px; background: var(--muted);
      }
      .dot.running { background: #4ade80; }
      .dot.error { background: var(--danger); }
      .dot.done { background: var(--accent); }
      .console {
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
        max-height: 360px;
        overflow: auto;
        background: #0b0d12;
        padding: 12px;
        border-radius: 6px;
      }
      .results {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
      }
      .result {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--panel-2);
      }
      .result img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
        background: #000;
      }
      .result-body { padding: 10px; font-size: 13px; }
      .muted { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>Manga Pipeline GUI</h1>
        <div class="section">
          <label>Mode
            <select id="mode">
              <option value="single">Single Page</option>
              <option value="batch">Batch</option>
            </select>
          </label>
          <label id="imagePathLabel">Image Path
            <input id="imagePath" placeholder="/absolute/path/to/page.png">
          </label>
          <label id="patternsLabel" style="display:none;">Batch Patterns
            <textarea id="patterns" placeholder="chapter/*.png&#10;chapter/*.jpg"></textarea>
          </label>
          <label>Config Path
            <input id="configPath" placeholder="config.yaml">
          </label>
          <label>Output Directory
            <input id="outputDir" placeholder="/absolute/path/to/output">
          </label>
          <div class="row">
            <label>API Key
              <input id="apiKey" type="password" placeholder="Optional">
            </label>
            <label>Max Pages
              <input id="maxPages" type="number" min="0" value="0">
            </label>
          </div>
          <div class="buttons">
            <button class="primary" id="runButton">Run</button>
            <button class="danger" id="stopButton">Stop</button>
          </div>
        </div>
      </aside>
      <main class="main">
        <section class="section">
          <div class="status">
            <span class="dot" id="statusDot"></span>
            <strong id="statusText">Idle</strong>
            <span class="muted" id="jobMeta"></span>
          </div>
        </section>
        <section class="section">
          <h2>Logs</h2>
          <div class="console" id="logs"></div>
        </section>
        <section class="section">
          <h2>Results</h2>
          <div class="results" id="results"></div>
        </section>
      </main>
    </div>
    <script>
      const mode = document.getElementById('mode');
      const imagePathLabel = document.getElementById('imagePathLabel');
      const patternsLabel = document.getElementById('patternsLabel');
      const imagePath = document.getElementById('imagePath');
      const patterns = document.getElementById('patterns');
      const configPath = document.getElementById('configPath');
      const outputDir = document.getElementById('outputDir');
      const apiKey = document.getElementById('apiKey');
      const maxPages = document.getElementById('maxPages');
      const logs = document.getElementById('logs');
      const results = document.getElementById('results');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const jobMeta = document.getElementById('jobMeta');

      function syncMode() {
        const batch = mode.value === 'batch';
        imagePathLabel.style.display = batch ? 'none' : 'block';
        patternsLabel.style.display = batch ? 'block' : 'block';
        patternsLabel.style.display = batch ? 'block' : 'none';
      }

      function renderResults(items) {
        results.innerHTML = '';
        for (const item of items || []) {
          const card = document.createElement('div');
          card.className = 'result';
          const img = document.createElement('img');
          if (item.final_image) {
            img.src = `/api/file?path=${encodeURIComponent(item.final_image)}`;
          }
          const body = document.createElement('div');
          body.className = 'result-body';
          body.innerHTML = `<strong>${item.page_id}</strong><div class="muted">${item.translated_count}/${item.bubble_count} translated</div>`;
          card.appendChild(img);
          card.appendChild(body);
          results.appendChild(card);
        }
      }

      async function refresh() {
        const res = await fetch('/api/status');
        const data = await res.json();
        const job = data.current_job;
        if (!configPath.value) {
          configPath.value = data.defaults.config_path;
          outputDir.value = data.defaults.output_dir;
          mode.value = data.defaults.mode;
          syncMode();
        }
        if (!job) {
          statusDot.className = 'dot';
          statusText.textContent = 'Idle';
          jobMeta.textContent = '';
          logs.textContent = '';
          results.innerHTML = '';
          return;
        }
        statusDot.className = `dot ${job.status}`;
        statusText.textContent = job.status.toUpperCase();
        jobMeta.textContent = `${job.id} · ${job.output_dir}`;
        logs.textContent = (job.logs || []).join('\n');
        renderResults(job.results || []);
      }

      async function runJob() {
        const payload = {
          mode: mode.value,
          image_path: imagePath.value,
          patterns: patterns.value,
          config_path: configPath.value,
          output_dir: outputDir.value,
          api_key: apiKey.value,
          max_pages: Number(maxPages.value || 0),
        };
        const res = await fetch('/api/run', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) alert(data.error);
        await refresh();
      }

      async function stopJob() {
        const res = await fetch('/api/stop', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
        const data = await res.json();
        if (!res.ok) alert(data.error);
        await refresh();
      }

      document.getElementById('runButton').addEventListener('click', runJob);
      document.getElementById('stopButton').addEventListener('click', stopJob);
      mode.addEventListener('change', syncMode);
      syncMode();
      refresh();
      setInterval(refresh, 1500);
    </script>
  </body>
</html>
