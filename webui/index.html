<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Manga-trans dashboard</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0b0d12;
    color: #d9e1e8;
    font: 13px/1.55 ui-monospace, Menlo, Monaco, Consolas, monospace;
  }
  header {
    border-bottom: 1px solid #2a313a;
    padding: 14px 18px;
    display: flex;
    gap: 18px;
    align-items: center;
    background: rgba(15,17,21,.85);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 { font-size: 14px; margin: 0; color: #ff7eb6; }
  main { padding: 18px; display: grid; grid-template-columns: 320px 1fr; gap: 18px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: #13171d; border: 1px solid #2a313a; border-radius: 12px; padding: 14px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #8b9eb0; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: #8b9eb0; margin: 8px 0 4px; }
  input, select, textarea {
    width: 100%;
    background: #0b0d12;
    color: #d9e1e8;
    border: 1px solid #2a313a;
    border-radius: 8px;
    padding: 8px 9px;
    font: inherit;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: #ff7eb6; }
  textarea { resize: vertical; min-height: 80px; }
  button {
    width: 100%;
    background: #ff7eb6;
    color: #0b0d12;
    border: 0;
    border-radius: 10px;
    padding: 10px;
    font-weight: 700;
    font: inherit;
    cursor: pointer;
    margin-top: 10px;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.stop { background: #ff6b6b; color: #0b0d12; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .muted { color: #8b9eb0; font-size: 12px; }
  .ok { color: #72f088; }
  .warn { color: #f2c97d; }
  .danger { color: #ff6b6b; }
  .logs {
    background: #0b0d12;
    border: 1px solid #2a313a;
    border-radius: 10px;
    padding: 10px;
    height: 240px;
    overflow: auto;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .logs .line { color: #aab7c4; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 8px; }
  .card {
    background: #0b0d12;
    border: 1px solid #2a313a;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .05s;
  }
  .card:hover { transform: translateY(-1px); border-color: #ff7eb6; }
  .card img { width: 100%; height: 120px; object-fit: cover; display: block; background: #000; }
  .card .meta { padding: 8px; font-size: 12px; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 6px; background: #1e2430; color: #82cfff; }
  .statusbar { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #8b9eb0; }
  .dot.running { background: #72f088; box-shadow: 0 0 8px #72f08855; }
  .dot.error { background: #ff6b6b; }
  a { color: #c4b5ff; }
</style>
</head>
<body>
<header>
  <h1>Manga-trans</h1>
  <span class="muted">로컬 파이프라인</span>
  <span id="statusDot" class="dot"></span>
  <span id="statusText" class="muted">대기</span>
</header>
<main>
  <section>
    <h2>설정</h2>
    <label>모드</label>
    <select id="mode">
      <option value="single">단일 이미지</option>
      <option value="batch">배치</option>
    </select>

    <label>config.yaml</label>
    <input id="configPath" value="config.yaml"/>

    <label>출력 폴더</label>
    <input id="outputDir" value="output"/>

    <label>API Key<sup class="muted">(옵션 — .env 사용시 비워도 됨)</sup></label>
    <input id="apiKey" type="password" placeholder="sk-or-..."/>

    <label id="imageLabel">이미지 경로</label>
    <input id="imagePath" placeholder="/Users/.../page01.png"/>

    <label id="patternsLabel" style="display:none">배치 패턴(줄바꿈 구분)</label>
    <textarea id="patterns" style="display:none" placeholder="/Users/.../input/*.png"></textarea>

    <label>최대 페이지<sup class="muted">(0=무제한)</sup></label>
    <input id="maxPages" type="number" value="0"/>

    <button id="runBtn" onclick="runPipeline()">실행</button>
    <button id="stopBtn" class="stop" onclick="stopPipeline()" disabled>중지</button>
  </section>

  <section>
    <h2>실행 로그</h2>
    <div id="logs" class="logs"><div class="muted">실행 후 로그가 여기 표시됩니다.</div></div>
    <div class="statusbar">
      <span id="statusBadge" class="badge">idle</span>
      <span id="updatedAt" class="muted"></span>
    </div>

    <h2 style="margin-top:18px">결과</h2>
    <div id="results" class="results"><div class="muted">아직 결과 없음.</div></div>
  </section>
</main>

<script>
const API = location.href.replace(/\/$/, '');
const $ = id => document.getElementById(id);

function getPayload() {
  return {
    mode: $('mode').value,
    config_path: $('configPath').value,
    output_dir: $('outputDir').value,
    api_key: $('apiKey').value,
    image_path: $('imagePath').value,
    patterns: $('patterns').value,
    max_pages: parseInt($('maxPages').value || '0', 10),
  };
}

async function runPipeline() {
  const res = await fetch(API + '/api/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(getPayload()),
  });
  if (!res.ok) { alert('실행 실패: ' + (await res.text())); return; }
  $('logs').innerHTML = '';
  $('runBtn').disabled = true;
  tick();
}

async function stopPipeline() {
  await fetch(API + '/api/stop', { method: 'POST' });
}

async function tick() {
  const res = await fetch(API + '/api/status');
  const data = await res.json();
  const job = data.current_job;
  const logEl = $('logs');
  if (job) {
    const tail = (job.logs || []).slice(-200);
    logEl.innerHTML = tail.map(l => `<div class="line">${escape(l)}</div>`).join('');
    logEl.scrollTop = logEl.scrollHeight;
    $('statusBadge').textContent = job.status;
    $('statusText').textContent = job.status;
    if (job.status === 'running') {
      $('statusDot').className = 'dot running';
      $('stopBtn').disabled = false;
    } else if (job.status === 'error') {
      $('statusDot').className = 'dot error';
      $('stopBtn').disabled = true;
      $('runBtn').disabled = false;
    } else {
      $('statusDot').className = 'dot';
      $('stopBtn').disabled = true;
      $('runBtn').disabled = false;
    }
    if (job.finished_at) {
      $('updatedAt').textContent = new Date(job.finished_at * 1000).toLocaleString('ko-KR');
    }
  } else {
    $('statusBadge').textContent = 'idle';
    $('statusText').textContent = '대기';
    $('statusDot').className = 'dot';
    $('stopBtn').disabled = true;
    $('runBtn').disabled = false;
  }
  renderResults(data.results || []);
  setTimeout(tick, 1000);
}

function renderResults(items) {
  const el = $('results');
  if (!items.length) { el.innerHTML = '<div class="muted">아직 결과 없음.</div>'; return; }
  el.innerHTML = items.map(it => `
    <div class="card" onclick="openFile('${escapeAttr(it.final_image || it.result_path)}')">
      <img src="${escapeAttr('/api/file?path=' + encodeURIComponent(it.final_image || it.result_path))}" loading="lazy"/>
      <div class="meta">
        <div><span class="badge">${escape(it.page_id)}</span></div>
        <div class="muted">말풍선 ${it.bubble_count} · 번역 ${it.translated_count}</div>
      </div>
    </div>
  `).join('');
}

function openFile(raw) {
  const url = raw.startsWith('http') ? raw : API + '/api/file?path=' + encodeURIComponent(raw);
  window.open(url, '_blank');
}

function escape(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
}

function escapeAttr(s) { return escape(s); }

$('mode').addEventListener('change', () => {
  const batch = $('mode').value === 'batch';
  $('patterns').style.display = batch ? 'block' : 'none';
  $('patternsLabel').style.display = batch ? 'block' : 'none';
  $('imageLabel').textContent = batch ? '이미지 경로<sup class="muted">(옵션)</sup>' : '이미지 경로';
});

// kick off polling
tick();
</script>
</body>
</html>
